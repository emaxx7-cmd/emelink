<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Emeli">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <title>Emeli</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { 
      height: 100%; 
      overflow: hidden;
      background: #080808;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e8e8e8;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    header {
      padding: 16px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 500;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .ideal-badge {
      background: rgba(180,160,255,0.12);
      color: #b4a0ff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      display: none;
      border: 1px solid rgba(180,160,255,0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .ideal-badge.on { display: block; }

    #habitsGrid {
      flex: 1;
      padding: 4px 16px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-content: flex-start;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: calc(100px + env(safe-area-inset-bottom));
    }
    #habitsGrid::-webkit-scrollbar { display: none; }

    .habit-card {
      background: rgba(22,22,24,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 22px;
      padding: 18px 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      width: calc(50% - 6px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.35s cubic-bezier(0.25, 0.1, 0.25, 1), 
                  box-shadow 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
      cursor: pointer;
      overflow: hidden;
      min-height: 120px;
    }
    .habit-card.wide { width: 100%; }
    .habit-card:active { 
      transform: scale(0.96); 
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      transition: transform 0.15s cubic-bezier(0.25, 0.1, 0.25, 1), 
                  box-shadow 0.15s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .fill-overlay {
      position: absolute;
      inset: 0;
      background: var(--habit-color, rgba(180,160,255,0.15));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
      border-radius: 22px;
    }
    .habit-card.done .fill-overlay { opacity: 0.2; }

    .habit-icon {
      font-size: 2.4rem;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
      transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .habit-card.done .habit-icon {
      transform: scale(1.1);
    }
    .habit-name {
      font-size: 0.78rem;
      color: #bbb;
      margin-bottom: 10px;
      text-align: center;
      display: none;
      position: relative;
      z-index: 1;
    }
    .habit-card.wide .habit-name { display: block; }

    .week-squares {
      display: flex;
      gap: 5px;
      margin-top: auto;
      position: relative;
      z-index: 1;
    }
    .day-square {
      width: 14px; height: 14px;
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
      transition: background 0.4s cubic-bezier(0.25, 0.1, 0.25, 1), 
                  box-shadow 0.4s cubic-bezier(0.25, 0.1, 0.25, 1),
                  transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .day-square.done {
      background: var(--habit-color, #b4a0ff);
      box-shadow: 0 0 14px var(--habit-color, rgba(180,160,255,0.6));
      transform: scale(1.15);
    }

    .card-menu-btn {
      position: absolute;
      top: 8px; right: 8px;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: none;
      color: #999;
      font-size: 1rem;
      cursor: pointer;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s ease, color 0.25s ease;
    }
    .card-menu-btn:active { 
      background: rgba(255,255,255,0.15); 
      color: #fff;
    }

    .fab {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom));
      right: calc(28px + env(safe-area-inset-right));
      width: 56px;
      height: 56px;
      background: #b4a0ff;
      color: #000;
      border: none;
      border-radius: 50%;
      font-size: 1.8rem;
      box-shadow: 0 8px 24px rgba(180,160,255,0.4);
      cursor: pointer;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s cubic-bezier(0.25, 0.1, 0.25, 1), 
                  box-shadow 0.35s cubic-bezier(0.25, 0.1, 0.25, 1),
                  background 0.25s ease;
    }
    .fab:active { 
      background: #c8b8ff; 
      transform: scale(0.92); 
      box-shadow: 0 4px 14px rgba(180,160,255,0.6);
      transition: transform 0.12s cubic-bezier(0.25, 0.1, 0.25, 1), 
                  box-shadow 0.12s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .overlay.active { opacity: 1; pointer-events: all; }

    .modal {
      background: #1a1a1e;
      border-radius: 28px 28px 0 0;
      padding: 28px 22px calc(28px + env(safe-area-inset-bottom));
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
      scrollbar-width: none;
      transform: translateY(20px);
      transition: transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .overlay.active .modal {
      transform: translateY(0);
    }
    .modal::-webkit-scrollbar { display: none; }
    .modal h2 { font-weight: 500; font-size: 1.2rem; margin-bottom: 20px; }

    .modal label {
      display: block;
      font-size: 0.8rem;
      color: #999;
      margin-bottom: 14px;
    }
    .modal input, .modal textarea {
      width: 100%;
      padding: 10px 12px;
      margin-top: 4px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 0.9rem;
      transition: border-color 0.3s ease, background 0.3s ease;
    }
    .modal input:focus, .modal textarea:focus {
      outline: none;
      border-color: rgba(180,160,255,0.5);
      background: rgba(255,255,255,0.1);
    }
    .modal textarea { resize: vertical; min-height: 50px; }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 22px;
    }
    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.25, 0.1, 0.25, 1), 
                  background 0.2s ease,
                  box-shadow 0.2s ease;
    }
    .btn-primary { background: #b4a0ff; color: #000; }
    .btn-primary:active { 
      background: #c8b8ff; 
      transform: scale(0.96); 
    }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; backdrop-filter: blur(10px); }
    .btn-secondary:active { 
      background: rgba(255,255,255,0.2); 
      transform: scale(0.96); 
    }

    .delete-link {
      color: #ff6b6b;
      background: none;
      border: none;
      font-size: 0.85rem;
      margin-top: 10px;
      cursor: pointer;
      display: block;
      transition: color 0.2s ease;
    }
    .delete-link:active { color: #ff4444; }

    .emoji-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      margin-bottom: 6px;
    }
    .emoji-picker span {
      width: 34px; height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .emoji-picker span:active { 
      background: rgba(255,255,255,0.2); 
      transform: scale(1.15); 
    }

    .heatmap {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      margin: 12px 0;
    }
    .heatmap-dot {
      width: 11px; height: 11px;
      border-radius: 2px;
      background: rgba(255,255,255,0.08);
      transition: background 0.3s ease, transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .heatmap-dot.filled { 
      background: var(--heat-color, #b4a0ff); 
      transform: scale(1.2);
    }

    .stat { font-size: 0.85rem; margin-bottom: 4px; }

    .context-menu {
      position: fixed;
      background: rgba(42,42,48,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 14px;
      padding: 6px 0;
      min-width: 130px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 2000;
      display: none;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,0.08);
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.25s cubic-bezier(0.25, 0.1, 0.25, 1), 
                  transform 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .context-menu.show {
      opacity: 1;
      transform: scale(1);
    }
    .context-menu button {
      background: none;
      border: none;
      color: #ddd;
      padding: 11px 16px;
      text-align: left;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .context-menu button:active { 
      background: rgba(255,255,255,0.1); 
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Emeli</h1>
    <div class="ideal-badge" id="idealBadge">Идеальная неделя</div>
  </header>

  <div id="habitsGrid"></div>

  <button class="fab" id="addBtn">+</button>

  <div class="context-menu" id="contextMenu"></div>

  <div class="overlay" id="detailOverlay">
    <div class="modal" id="detailModal"></div>
  </div>

  <div class="overlay" id="formOverlay">
    <div class="modal" id="formModal"></div>
  </div>

  <script>
  (function() {
    // ---------- IndexedDB ----------
    let db;
    function openDB(){
      return new Promise((res,rej)=>{
        const r = indexedDB.open('emeli',1);
        r.onupgradeneeded = e => {
          const d = e.target.result;
          if(!d.objectStoreNames.contains('habits')){ const s=d.createObjectStore('habits',{keyPath:'id',autoIncrement:true}); s.createIndex('order','order'); }
          if(!d.objectStoreNames.contains('comps')){ const s=d.createObjectStore('comps',{keyPath:'id',autoIncrement:true}); s.createIndex('hd',['hId','date'],{unique:true}); }
        };
        r.onsuccess = e => { db=e.target.result; res(); };
        r.onerror = e => rej(e);
      });
    }
    function ts(n,m){ return db.transaction(n,m).objectStore(n); }

    const DB = {
      habits: async () => { const r = await new Promise(rs=>{ const q=ts('habits','readonly').getAll(); q.onsuccess=()=>rs(q.result); }); return r.sort((a,b)=>a.order-b.order); },
      habit: id => new Promise(rs=>{ const q=ts('habits','readonly').get(id); q.onsuccess=()=>rs(q.result); }),
      add: async data => {
        const all = await DB.habits();
        const max = all.length ? Math.max(...all.map(h=>h.order)) : 0;
        const h = { ...data, order:max+1, wide:false, created: new Date().toISOString() };
        return new Promise(rs=>{ const q=ts('habits','readwrite').add(h); q.onsuccess=()=>rs(q.result); });
      },
      update: h => new Promise(rs=>{ ts('habits','readwrite').put(h); rs(); }),
      del: id => {
        ts('habits','readwrite').delete(id);
        const s = ts('comps','readwrite'); const idx = s.index('hd');
        idx.openCursor(IDBKeyRange.bound([id,''], [id,'\uffff'])).onsuccess = e => {
          const c = e.target.result; if(c){ c.delete(); c.continue(); }
        };
      },
      toggle: (hId,date) => new Promise(rs=>{
        const s=ts('comps','readwrite'); const idx=s.index('hd'); const q=idx.get([hId,date]);
        q.onsuccess = e => {
          const rec = e.target.result;
          if(rec){ s.delete(rec.id); rs(false); }
          else{ s.add({hId,date}); rs(true); }
        };
      }),
      comps: async hId => {
        const all = await new Promise(rs=>{ const q=ts('comps','readonly').getAll(); q.onsuccess=()=>rs(q.result); });
        return all.filter(c=>c.hId===hId).map(c=>c.date);
      }
    };

    // ---------- Helpers ----------
    const monday = d => { const nd=new Date(d); nd.setDate(nd.getDate()-(nd.getDay()||7)+1); return nd; };
    const fmt = d => d.toISOString().slice(0,10);
    const days = (a,b) => Math.round((b-a)/864e5);
    const streaks = dates => {
      const u = [...new Set(dates)].sort();
      let cur=0,best=0;
      if(u.length){
        const t=fmt(new Date()), y=fmt(new Date(Date.now()-864e5));
        const end = u.includes(t)?t:u.includes(y)?y:null;
        if(end){ let d=new Date(end); while(u.includes(fmt(d))){ cur++; d.setDate(d.getDate()-1); } }
        let tmp=0,prev=null;
        for(const s of u){ const d=new Date(s); if(prev&&days(prev,d)===1)tmp++;else tmp=1; best=Math.max(best,tmp); prev=d; }
        best=Math.max(best,cur);
      }
      return {cur,best};
    };

    // ---------- DOM ----------
    const grid = document.getElementById('habitsGrid');
    const ideal = document.getElementById('idealBadge');
    const addBtn = document.getElementById('addBtn');
    const ctxMenu = document.getElementById('contextMenu');
    const dOver = document.getElementById('detailOverlay');
    const dMod = document.getElementById('detailModal');
    const fOver = document.getElementById('formOverlay');
    const fMod = document.getElementById('formModal');

    let pressTimer, pressDone=false;

    // ---------- Рендер ----------
    async function render(){
      const habits = await DB.habits();
      const mon = monday(new Date());
      const week = Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return fmt(d); });
      const today = fmt(new Date());
      grid.innerHTML = '';
      let perfect = habits.length > 0;

      for(const h of habits){
        const comps = await DB.comps(h.id);
        const card = document.createElement('div');
        card.className = 'habit-card' + (h.wide?' wide':'');
        card.dataset.id = h.id;
        const color = h.color || '#b4a0ff';
        card.style.setProperty('--habit-color', color);

        const fill = document.createElement('div'); fill.className='fill-overlay'; card.appendChild(fill);

        const ic = document.createElement('div'); ic.className='habit-icon'; ic.textContent=h.icon||'⭐'; card.appendChild(ic);
        const nm = document.createElement('div'); nm.className='habit-name'; nm.textContent=h.name; card.appendChild(nm);

        const sqs = document.createElement('div'); sqs.className='week-squares';
        week.forEach(d=>{ const sq=document.createElement('div'); sq.className='day-square'+(comps.includes(d)?' done':''); sqs.appendChild(sq); });
        card.appendChild(sqs);

        if(comps.includes(today)) card.classList.add('done');

        const menuBtn = document.createElement('button'); menuBtn.className='card-menu-btn'; menuBtn.textContent='⋮';
        menuBtn.onclick = e => { e.stopPropagation(); cardMenu(h.id,card); };
        card.appendChild(menuBtn);

        card.addEventListener('pointerdown', e => startPress(e, h.id));
        card.addEventListener('pointerup', endPress);
        card.addEventListener('pointerleave', endPress);
        card.addEventListener('pointercancel', endPress);
        card.addEventListener('click', e => { if(!pressDone) openDetail(h.id); });

        grid.appendChild(card);

        if(perfect){
          const idx = week.indexOf(today);
          const check = idx>=0 ? week.slice(0,idx+1) : week;
          for(const d of check) if(!comps.includes(d)){ perfect=false; break; }
        }
      }
      ideal.classList.toggle('on', perfect && habits.length>0);
    }

    function startPress(e, hId){
      pressDone = false;
      pressTimer = setTimeout(async ()=>{
        pressDone = true;
        const today = fmt(new Date());
        await DB.toggle(hId, today);
        await render();
        if(navigator.vibrate) navigator.vibrate(10);
        const h = await DB.habit(hId);
        if(h && h.reminder) schedule(h);
      }, 500);
      e.preventDefault();
    }
    function endPress(){
      if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
    }

    function cardMenu(hId, card){
      ctxMenu.innerHTML = '';
      const wideBtn = document.createElement('button');
      wideBtn.textContent = card.classList.contains('wide') ? 'Сжать' : 'Растянуть';
      wideBtn.onclick = async () => {
        const h = await DB.habit(hId); h.wide = !h.wide; await DB.update(h);
        hideCtx(); render();
      };
      const delBtn = document.createElement('button');
      delBtn.textContent = 'Удалить';
      delBtn.onclick = async () => {
        if(confirm('Удалить?')){ await DB.del(hId); hideCtx(); render(); }
      };
      ctxMenu.appendChild(wideBtn); ctxMenu.appendChild(delBtn);
      const r = card.getBoundingClientRect();
      ctxMenu.style.left=Math.min(r.right-20, window.innerWidth-140)+'px';
      ctxMenu.style.top=Math.min(r.top, window.innerHeight-90)+'px';
      // Show with animation
      ctxMenu.style.display='flex';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ctxMenu.classList.add('show');
        });
      });
      setTimeout(()=>document.addEventListener('click', function h(){ hideCtx(); document.removeEventListener('click',h); },{once:true}),0);
    }
    function hideCtx(){ 
      ctxMenu.classList.remove('show');
      setTimeout(() => { ctxMenu.style.display='none'; }, 250);
    }

    async function openDetail(id){
      const h = await DB.habit(id);
      const comps = await DB.comps(id);
      const created = new Date(h.created);
      const total = days(created, new Date()) + 1;
      const pct = total>0 ? Math.round((comps.length/total)*100) : 0;
      const st = streaks(comps);
      dMod.innerHTML = `
        <h2>${h.icon||'⭐'} ${h.name}</h2>
        <p style="color:#aaa;margin-bottom:12px;">${h.description||'Без описания'}</p>
        <p style="font-size:0.8rem;">Категория: ${h.category||'—'} | Теги: ${h.tags?.join(', ')||'—'}</p>
        <div class="stat">Текущий стрик: ${st.cur} дн.</div>
        <div class="stat">Лучший стрик: ${st.best} дн.</div>
        <div class="stat">Вероятность выполнения: ${pct}%</div>
        <p style="margin-top:14px;">Тепловая карта:</p>
        <div class="heatmap" id="heatmap" style="--heat-color:${h.color||'#b4a0ff'}"></div>
        <label>Ежедневное напоминание <input type="time" id="remTime" value="${h.reminder||''}"></label>
        <div class="modal-buttons">
          <button class="btn btn-secondary" id="editFromDetail">Изменить</button>
          <button class="btn btn-primary" id="closeDetail">Готово</button>
        </div>
        <button class="delete-link" id="delFromDetail">Удалить привычку</button>
      `;
      dOver.classList.add('active');

      const hm = document.getElementById('heatmap');
      const t = new Date();
      for(let i=0;i<365;i++){ const d=new Date(t); d.setDate(t.getDate()-(364-i)); const ds=fmt(d); const dot=document.createElement('div'); dot.className='heatmap-dot'+(comps.includes(ds)?' filled':''); hm.appendChild(dot); }

      document.getElementById('closeDetail').onclick = ()=>{ dOver.classList.remove('active'); render(); };
      document.getElementById('editFromDetail').onclick = ()=>{ dOver.classList.remove('active'); openForm(h); };
      document.getElementById('delFromDetail').onclick = async ()=>{ if(confirm('Удалить?')){ await DB.del(id); dOver.classList.remove('active'); render(); } };
      document.getElementById('remTime').onchange = async e => { h.reminder=e.target.value; await DB.update(h); schedule(h); };
    }

    function openForm(habit=null){
      const edit = !!habit;
      const emojis = ['⭐','💪','🧠','📚','💧','🏃','🧘','🎯','💤','🍎','🚭','✍️','📱','🎨','💰'];
      fMod.innerHTML = `
        <h2>${edit?'Редактировать':'Новая привычка'}</h2>
        <label>Название <input type="text" id="fName" value="${habit?.name||''}"></label>
        <label>Описание <textarea id="fDesc">${habit?.description||''}</textarea></label>
        <label>Категория <input type="text" id="fCat" value="${habit?.category||''}"></label>
        <label>Цвет <input type="color" id="fColor" value="${habit?.color||'#b4a0ff'}"></label>
        <label>Иконка <input type="text" id="fIcon" value="${habit?.icon||'⭐'}" maxlength="2"></label>
        <div class="emoji-picker" id="emojiPicker"></div>
        <label>Теги (через запятую) <input type="text" id="fTags" value="${habit?.tags?.join(',')||''}"></label>
        <div class="modal-buttons">
          <button class="btn btn-secondary" id="cancelForm">Отмена</button>
          <button class="btn btn-primary" id="saveForm">Сохранить</button>
        </div>
      `;
      fOver.classList.add('active');

      const ep = document.getElementById('emojiPicker');
      emojis.forEach(e=>{ const s=document.createElement('span'); s.textContent=e; s.onclick=()=>{ document.getElementById('fIcon').value=e; }; ep.appendChild(s); });

      document.getElementById('cancelForm').onclick = ()=>{ fOver.classList.remove('active'); };
      document.getElementById('saveForm').onclick = async ()=>{
        const name = document.getElementById('fName').value.trim();
        if(!name){ alert('Введи название'); return; }
        const data = {
          name,
          description: document.getElementById('fDesc').value.trim(),
          category: document.getElementById('fCat').value.trim(),
          color: document.getElementById('fColor').value,
          icon: document.getElementById('fIcon').value.trim() || '⭐',
          tags: document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean),
        };
        if(edit){
          const upd = {...habit, ...data};
          await DB.update(upd);
          if(upd.reminder) schedule(upd);
        } else {
          const newId = await DB.add(data);
          const h = await DB.habit(newId);
          if(h && h.reminder) schedule(h);
        }
        fOver.classList.remove('active');
        render();
      };
    }

    const timers = {};
    function schedule(h){
      if(!h.reminder) return;
      if(timers[h.id]) clearTimeout(timers[h.id]);
      const [hh,mm] = h.reminder.split(':');
      const now = new Date();
      const rd = new Date(); rd.setHours(hh,mm,0,0);
      if(rd <= now) rd.setDate(rd.getDate()+1);
      timers[h.id] = setTimeout(()=>{
        if(Notification.permission==='granted'){
          new Notification('Emeli', { body: `Не забудь: ${h.name}`, icon: 'icon.svg' });
        }
        schedule(h);
      }, rd - now);
    }

    addBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      openForm();
    });

    openDB().then(async ()=>{
      await render();
      if(Notification.permission==='default') Notification.requestPermission();
    });
    window.addEventListener('focus', render);
  })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
